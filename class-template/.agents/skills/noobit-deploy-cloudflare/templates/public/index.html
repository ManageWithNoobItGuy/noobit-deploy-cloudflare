<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เว็บแรกของฉันบน Cloudflare</title>
  <style>
    body { font-family: system-ui, "Noto Sans Thai", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 8px; background: #f38020; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    li button { background: #eee; color: #333; padding: 4px 10px; }
    small { color: #888; }
  </style>
</head>
<body>
  <h1>📝 รายการของฉัน</h1>
  <p><small>ข้อมูลเก็บในฐานข้อมูล Cloudflare D1 · เปิดจากเครื่องไหนก็เห็นเหมือนกัน</small></p>
  <form id="f">
    <input id="t" placeholder="พิมพ์อะไรสักอย่าง..." autocomplete="off" />
    <button>เพิ่ม</button>
  </form>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");

    async function load() {
      const res = await fetch("/api/items");
      const items = await res.json();
      list.innerHTML = "";
      for (const it of items) {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = it.text;
        const del = document.createElement("button");
        del.textContent = "ลบ";
        del.onclick = async () => { await fetch("/api/items/" + it.id, { method: "DELETE" }); load(); };
        li.append(span, del);
        list.append(li);
      }
    }

    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("t");
      const text = input.value.trim();
      if (!text) return;
      await fetch("/api/items", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
